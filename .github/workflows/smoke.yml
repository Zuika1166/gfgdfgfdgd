name: Demo smoke checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS
        run: node --check app.js
      - name: Browser demo logic smoke tests
        run: node --test tests/demo.test.cjs
