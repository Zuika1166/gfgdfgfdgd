name: Publish NOVADROP demo preview
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Publish static non-commercial preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static distribution
        run: |
          mkdir -p _site
          cp index.html app.js styles.css experience.css studio.css favicon.svg manifest.webmanifest _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
